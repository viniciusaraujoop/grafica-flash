            echo "Unexpected changed files:"
            echo "$bad"
            exit 1
          fi

      - name: Commit dependency files back to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "orcaly-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(import-engine): pin csv-parse 7.0.2"
          git push origin HEAD:claude/orcaly-import-csv-t3
