name: Storefront Marketplace v2 QA

on:
  pull_request:
    paths:
      - 'app/site/**'
      - 'app/api/public-site/**'
      - 'app/api/site/**'
      - 'app/api/reports/storefront/**'
      - 'app/painel/relatorios/**'
      - 'components/public-site/**'
      - 'components/site-builder/**'
      - 'lib/storefront/**'
      - 'supabase/migrations/20260819234000_storefront_marketplace_v2.sql'
      - 'scripts/verify-storefront-marketplace-v2.mjs'
      - 'package.json'
      - '.github/workflows/storefront-marketplace-v2.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Domain and regression invariants
        run: npm test
      - name: Payment boundary regression
        run: npm run verify:payments
      - name: Focused lint
        run: >-
          npx eslint
          components/public-site/StorefrontExperienceV2.tsx
          components/public-site/StorefrontProductActions.tsx
          components/public-site/PublicSiteClient.tsx
          components/site-builder/SitePreview.tsx
          app/site/[slug]/produto/[productId]/page.tsx
          app/api/public-site/[slug]/search/route.ts
          app/api/public-site/[slug]/events/route.ts
          app/api/site/settings/route.ts
          app/api/reports/storefront/route.ts
          app/painel/relatorios/page.tsx
          lib/storefront/public-product.ts
      - name: TypeScript and production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder
          NEXT_PUBLIC_APP_URL: https://ci.orcaly.invalid
        run: npm run build
      - name: Exact-SHA PR protected paths and whitespace guard
        if: github.event_name == 'pull_request'
        env:
          ORCALY_QA_SCOPE: storefront
          ORCALY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ORCALY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/verify-focused-pr-delta.cjs
      - name: Manual QA run has no PR-delta certification
        if: github.event_name == 'workflow_dispatch'
        run: echo "::notice::Manual QA checks are informational; no PR head/base was provided for protected diff certification."
      - name: Dependency audit baseline
        continue-on-error: true
        run: npm audit --audit-level=high

  global-lint-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Global lint baseline
        run: npm run lint
