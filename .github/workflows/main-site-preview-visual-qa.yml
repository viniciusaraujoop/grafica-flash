name: Main Site Preview Visual QA

on:
  push:
    branches:
      - feat/main-site-premium-redesign
    paths:
      - 'app/page.tsx'
      - 'app/MainSitePremium.module.css'
      - 'app/MainSiteAssistantPremium.module.css'
      - 'components/marketing/**'
      - 'components/home/HomeAiChat.tsx'
      - 'lib/marketing/main-site.ts'
      - 'scripts/verify-main-site-v2.mjs'
      - 'scripts/verify-main-site-visual-lock.mjs'
      - 'scripts/main-site-browser-qa.mjs'
      - '.github/workflows/main-site-preview-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: visual-qa-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: visual-qa-placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Candidate production build
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start exact candidate locally
        shell: bash
        run: |
          npm start -- -p 4173 > /tmp/orcaly-main-site.log 2>&1 &
          echo $! > /tmp/orcaly-main-site.pid
          node <<'NODE'
          const deadline = Date.now() + 90_000
          while (Date.now() < deadline) {
            try {
              const response = await fetch('http://127.0.0.1:4173/')
              if (response.ok) {
                console.log('Candidate server is ready.')
                process.exit(0)
              }
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 1_000))
          }
          console.error('Candidate server did not become ready.')
          process.exit(1)
          NODE

      - name: Run responsive browser QA
        run: node scripts/main-site-browser-qa.mjs

      - name: Capture candidate server log
        if: always()
        run: |
          mkdir -p qa-artifacts
          cp /tmp/orcaly-main-site.log qa-artifacts/server.log 2>/dev/null || true

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-site-preview-visual-qa-${{ github.sha }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7
