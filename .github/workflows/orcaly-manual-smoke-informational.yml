name: Orçaly Manual Smoke (Informational Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-smoke-no-pr-certification:
    name: manual-smoke-no-pr-certification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Manual invocation cannot certify a PR
        run: echo "::notice::Informational smoke only. No exact PR SHA, no protected diff attestation."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Existing domain regression tests
        run: npm test
      - name: Existing payment regression tests
        run: npm run verify:payments
      - name: TypeScript and production build smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder
          NEXT_PUBLIC_APP_URL: https://ci.orcaly.invalid
        run: npm run build
      - name: Dependency audit baseline (informational)
        continue-on-error: true
        run: npm audit --audit-level=high
