name: Orçaly 3.1 Lockfile Refresh

on:
  push:
    branches:
      - feat/orcaly-3-1
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: orcaly-3-1-lockfile-refresh
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify runtime audit before commit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh lockfile for Next 16.3.4"
          git push origin HEAD:feat/orcaly-3-1
