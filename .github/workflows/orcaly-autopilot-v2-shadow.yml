name: Orçaly Autopilot V2 Shadow Dispatcher

# Only checks founder-authored public documentation mission eligibility.
# NO paid models, no GitHub writes, no agent execution, no migrations.
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: orcaly-autopilot-v2-shadow
  cancel-in-progress: false

jobs:
  propose-only:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.actor == 'viniciusaraujoop')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout trusted main without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - name: Read public issue metadata and produce safe proposals
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7 pinned
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const policy = JSON.parse(fs.readFileSync(
              path.join(process.env.GITHUB_WORKSPACE,'docs/automation/autopilot-v2-shadow-policy.json'),
              'utf8'
            ));
            const {assertPolicy,project,summary} = require(
              path.join(process.env.GITHUB_WORKSPACE,'scripts/automation/autopilot-v2-shadow.cjs')
            );
            assertPolicy(policy); // fail closed BEFORE any GitHub API call.
            if (policy.repository !== context.repo.owner + '/' + context.repo.repo ||
                context.ref !== 'refs/heads/main') {
              core.setFailed('TRUSTED_REPOSITORY_OR_REF_REQUIRED');
              return;
            }
            const issuesByNumber = {};
            for (const m of policy.prototype_missions) {
              try {
                const {data: issue} = await github.rest.issues.get({
                  owner:context.repo.owner, repo:context.repo.repo, issue_number:m.issue_number
                });
                // Deliberately never read/display body/comments/labels or private attachments.
                issuesByNumber[m.issue_number] = {
                  number: issue.number, title: issue.title, state: issue.state,
                  user:{login:issue.user?.login},
                  pull_request:Boolean(issue.pull_request)
                };
              } catch (err) {
                if (err?.status !== 404) throw err;
              }
            }
            const report = project({
              policy, issuesByNumber,
              expectedRepo:context.repo.owner + '/' + context.repo.repo,
              date:new Date().toISOString()
            });
            await core.summary.addRaw(summary(report)).write();
            core.info('ORCALY_SHADOW_DISPATCH_NO_PAID_AI proposals=' + report.candidates.length);
            // Completed documentation PRs are observed, never dispatched.
            // Read exact repo/commit and machine statuses; no PR/Issue bodies or review text.
            const {assertReadOnlyContract,reportHandoff,renderHandoffSummary} = require(
              path.join(process.env.GITHUB_WORKSPACE,'scripts/automation/mission-handoff-v1.cjs')
            );
            assertReadOnlyContract(policy);
            const owner=context.repo.owner, repo=context.repo.repo;
            const {data:recentPrs} = await github.rest.pulls.list({
              owner,repo,state:'all',per_page:100
            });
            const expected=policy.prototype_missions[0].expected_branch;
            const matches=recentPrs.filter(pr=>pr.head?.ref===expected &&
              pr.head?.repo?.full_name===owner+'/'+repo && pr.base?.ref==='main');
            let runData=[],reviewData=[];
            if (matches.length===1) {
              const [{data:runResponse},{data:reviews}]=await Promise.all([
                github.rest.actions.listWorkflowRunsForRepo({
                  owner,repo,head_sha:matches[0].head.sha,per_page:100
                }),
                github.rest.pulls.listReviews({
                  owner,repo,pull_number:matches[0].number,per_page:100
                })
              ]);
              runData=(runResponse.workflow_runs||[]).map(run=>({
                id:run.id,name:run.name,event:run.event,status:run.status,
                conclusion:run.conclusion,head_sha:run.head_sha,head_branch:run.head_branch,
                created_at:run.created_at
              }));
              reviewData=reviews.map(rev=>({
                user:{login:rev.user?.login},state:rev.state,commit_id:rev.commit_id
              }));
            }
            const handoff=reportHandoff({
              policy,issue:issuesByNumber[23],prs:recentPrs,
              runs:runData,reviews:reviewData,repository:owner+'/'+repo,
              windows:{prs_complete:recentPrs.length<100,
                runs_complete:runData.length<100,reviews_complete:reviewData.length<100}
            });
            await core.summary.addRaw(renderHandoffSummary(handoff)).write();
            core.info('ORCALY_HANDOFF_PHASE='+handoff.phase);
