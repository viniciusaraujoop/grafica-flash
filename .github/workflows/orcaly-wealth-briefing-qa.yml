name: Orçaly Wealth Briefing Hosted QA

on:
  push:
    branches:
      - codex/orcaly-ecosystem
    paths:
      - 'app/apps/wealth/briefing/**'
      - 'app/apps/wealth/page.tsx'
      - 'lib/wealth/briefing.ts'
      - 'supabase/migrations/20260927132000_wealth_morning_night_briefing.sql'
      - 'scripts/test-wealth-briefing.mjs'
      - 'scripts/e2e-wealth-briefing-hosted.mjs'
      - '.github/workflows/orcaly-wealth-briefing-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: orcaly-wealth-briefing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_CONTROL_URL: https://zwxulgpjucxudadjdqov.supabase.co/functions/v1/wealth-rolling-qa-control
      QA_OIDC_AUDIENCE: orcaly-wealth-rolling-qa
      PREVIEW_URL: https://orcaly-git-codex-orcaly-ecosystem-vinicius-araujos-projects.vercel.app
      ORCALY_STAGING_ANON_KEY: sb_publishable_tvQpmDKMlHCAcKIxLiN87w_c8J8iP3H
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROMIUM_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Morning Night domain and PostgreSQL tests
        run: node --test scripts/test-wealth-briefing.mjs

      - name: Morning Night scoped lint
        run: >-
          npx eslint
          app/apps/wealth/briefing/page.tsx
          lib/wealth/briefing.ts
          scripts/e2e-wealth-briefing-hosted.mjs

      - name: Mint QA OIDC token for fixture creation
        uses: actions/github-script@v7
        id: qa_oidc
        with:
          script: |
            const token = await core.getIDToken(process.env.QA_OIDC_AUDIENCE)
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Create disposable Wealth identities
        shell: bash
        env:
          QA_TOKEN: ${{ steps.qa_oidc.outputs.token }}
        run: |
          set -euo pipefail
          create_user() {
            local label="$1"
            local mode="$2"
            local response
            response="$(curl --silent --show-error --fail-with-body               -X POST "$QA_CONTROL_URL"               -H "Authorization: Bearer $QA_TOKEN"               -H 'Content-Type: application/json'               --data "{\"action\":\"create\",\"mode\":\"$mode\",\"sourceCommit\":\"$GITHUB_SHA\"}")"
            local id email password
            id="$(printf '%s' "$response" | jq -r '.userId')"
            email="$(printf '%s' "$response" | jq -r '.email')"
            password="$(printf '%s' "$response" | jq -r '.password')"
            test -n "$id"; test -n "$email"; test -n "$password"
            echo "::add-mask::$id"; echo "::add-mask::$email"; echo "::add-mask::$password"
            {
              echo "QA_${label}_ID=$id"
              echo "QA_${label}_EMAIL=$email"
              echo "QA_${label}_PASSWORD=$password"
            } >> "$GITHUB_ENV"
          }
          create_user A full
          create_user B full
          create_user NO none

      - name: Wait for exact protected Preview commit
        shell: bash
        env:
          QA_TOKEN: ${{ steps.qa_oidc.outputs.token }}
        run: |
          set -euo pipefail
          observed=""
          status=""
          response="$(curl --silent --show-error --fail-with-body             -X POST "$QA_CONTROL_URL"             -H "Authorization: Bearer $QA_TOKEN"             -H 'Content-Type: application/json'             --data "{\"action\":\"preview_access\",\"sourceCommit\":\"$GITHUB_SHA\"}")"
          access="$(printf '%s' "$response" | jq -r '.share // empty')"
          test -n "$access"
          PREVIEW_URL="$(ACCESS="$access" node -e "
            const u=new URL(process.env.ACCESS||'');
            if(u.protocol!=='https:'||!/^orcaly-[a-z0-9]+-vinicius-araujos-projects\\.vercel\\.app$/.test(u.hostname)||u.hostname.includes('-git-')) process.exit(2);
            process.stdout.write(u.origin);
          ")"
          VERCEL_PREVIEW_SHARE="$(ACCESS="$access" node -e "
            const u=new URL(process.env.ACCESS||'');
            const value=u.searchParams.get('_vercel_share')||'';
            if(!value) process.exit(2);
            process.stdout.write(value);
          ")"
          echo "::add-mask::$access"
          echo "::add-mask::$VERCEL_PREVIEW_SHARE"
          cookie_jar="$RUNNER_TEMP/briefing-preview.cookies"
          : > "$cookie_jar"
          for attempt in $(seq 1 90); do
            body_file="$RUNNER_TEMP/briefing-preview-body"
            header_file="$RUNNER_TEMP/briefing-preview-headers"
            : > "$body_file"; : > "$header_file"
            status="$(curl --location --silent --show-error               --connect-timeout 10 --max-time 20               --cookie "$cookie_jar" --cookie-jar "$cookie_jar"               --dump-header "$header_file" --output "$body_file" --write-out '%{http_code}'               "$PREVIEW_URL/api/internal/preview-build?_vercel_share=$VERCEL_PREVIEW_SHARE" || true)"
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/\r$/, ""); value=$0} END{sub(/^[^:]+:[[:space:]]*/, "", value); print value}' "$header_file")"
            observed="$(node -e "const fs=require('fs');try{const v=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(v.commit||'')}catch{}" "$body_file")"
            printf 'preview attempt=%s status=%s content_type=%s commit=%s\n' "$attempt" "${status:-none}" "${content_type:-unknown}" "${observed:-none}"
            if [ "$status" = "200" ] && [[ "$content_type" == application/json* ]] && [ "$observed" = "$GITHUB_SHA" ]; then
              {
                echo "PREVIEW_URL=$PREVIEW_URL"
                echo "VERCEL_PREVIEW_SHARE=$VERCEL_PREVIEW_SHARE"
              } >> "$GITHUB_ENV"
              echo "Preview converged to exact commit."
              exit 0
            fi
            sleep 4
          done
          echo "Preview did not converge. expected=$GITHUB_SHA observed=${observed:-none} status=${status:-none}" >&2
          exit 1

      - name: Mint fresh QA OIDC token for hosted matrix
        uses: actions/github-script@v7
        id: matrix_qa_oidc
        with:
          script: |
            const token = await core.getIDToken(process.env.QA_OIDC_AUDIENCE)
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Run hosted Morning Night matrix
        env:
          ORCALY_E2E_BASE_URL: ${{ env.PREVIEW_URL }}
          ORCALY_EXPECTED_COMMIT: ${{ github.sha }}
          VERCEL_PREVIEW_SHARE: ${{ env.VERCEL_PREVIEW_SHARE }}
          ORCALY_QA_OIDC_TOKEN: ${{ steps.matrix_qa_oidc.outputs.token }}
        run: node scripts/e2e-wealth-briefing-hosted.mjs

      - name: Upload Morning Night QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wealth-briefing-hosted-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: artifacts/wealth-briefing/**

      - name: Cleanup disposable Wealth identities with fresh OIDC
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --silent --show-error --fail-with-body             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${QA_OIDC_AUDIENCE}")"
          QA_TOKEN="$(printf '%s' "$token_json" | jq -r '.value')"
          test -n "$QA_TOKEN"
          echo "::add-mask::$QA_TOKEN"
          cleanup_user() {
            local id="$1"
            [ -z "$id" ] && return 0
            curl --silent --show-error --fail-with-body               -X POST "$QA_CONTROL_URL"               -H "Authorization: Bearer $QA_TOKEN"               -H 'Content-Type: application/json'               --data "{\"action\":\"cleanup\",\"userId\":\"$id\",\"sourceCommit\":\"$GITHUB_SHA\"}" >/dev/null
          }
          cleanup_user "${QA_A_ID:-}"
          cleanup_user "${QA_B_ID:-}"
          cleanup_user "${QA_NO_ID:-}"
