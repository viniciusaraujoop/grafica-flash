name: R10 repository evidence guards (not replay certification)

on:
  workflow_dispatch:
  push:
    branches:
      - reconcile/r10-production-base-canonicalization
    paths:
      - 'supabase/provenance/**'
      - 'supabase/replay-forms/**'
      - 'supabase/migrations/**'
      - 'scripts/db/**'
      - '.github/workflows/r10-evidence-guards.yml'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  evidence-and-active-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Checkpoint evidence tests (not P7)
        run: node --test scripts/db/r10-contract.test.cjs
      - name: Secret scan includes decoded binary evidence
        run: node scripts/db/secret-scan
      - name: Require canonical active directory (expected blocked until P6)
        run: node scripts/db/verify-active-dir
      # No credentials, database connection, migration application or deployment.
      # Disposable replay certification cannot be added until P4 dependencies close.
