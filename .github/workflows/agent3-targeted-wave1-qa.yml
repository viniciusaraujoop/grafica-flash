name: Agent 3 Targeted Wave1 QA Harness

on:
  push:
    branches:
      - gpt/agent3-targeted-qa-harness
    paths:
      - .github/workflows/agent3-targeted-wave1-qa.yml

permissions:
  contents: read

jobs:
  wave1-targeted-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: qa-public-placeholder
      SUPABASE_SERVICE_ROLE_KEY: qa-server-placeholder
      PAYMENT_CREDENTIALS_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CRON_SECRET: qa-cron-placeholder
      NEXT_PUBLIC_ROOT_DOMAIN: example.test
      NEXT_PUBLIC_SITE_URL: https://example.test
      NEXT_PUBLIC_APP_URL: https://example.test
      ORCALY_APP_URL: https://example.test
    steps:
      - name: Checkout exact Wave1 T1 SHA
        uses: actions/checkout@v4
        with:
          ref: 38b5aeb94d7bb258689cb7c34e699bc0648bf75e

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wave1 suite
        run: npm run test:wave1

      - name: Global test suite
        run: npm test

      - name: TypeScript noEmit
        run: npx tsc --noEmit --incremental false

      - name: Focused Wave1 lint
        run: npx eslint --no-warn-ignored lib/actions/contracts lib/automation-recipes lib/detectors/contracts lib/events/contracts lib/industry-packs lib/wave1

      - name: Wave1 coverage
        run: node --experimental-test-coverage --test scripts/wave1/test-shared.mjs scripts/wave1/test-industry-packs.mjs scripts/wave1/test-automation-recipes.mjs

      - name: Production build
        run: npm run build
