name: Import CSV T3 Exact-SHA QA

on:
  pull_request:
    branches:
      - main

jobs:
  import-csv-t3-exact-sha:
    name: Import CSV T3 exact SHA execution
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout frozen Import CSV T3 SHA
        uses: actions/checkout@v4
        with:
          ref: 14507126d6419baf7c789a1fda2b1dc082c1cb21
          fetch-depth: 0

      - name: Verify exact target SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="14507126d6419baf7c789a1fda2b1dc082c1cb21"
          echo "actual=$actual"
          echo "expected=$expected"
          test "$actual" = "$expected"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify csv-parse version
        run: npm ls csv-parse --depth=0

      - name: Dependency audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const vulns = audit.vulnerabilities || {};
          const csv = vulns['csv-parse'];
          const meta = audit.metadata?.vulnerabilities || {};
          console.log('audit totals:', JSON.stringify(meta));
          if (csv) {
            console.error('csv-parse vulnerability detected:', JSON.stringify(csv));
            process.exit(1);
          }
          console.log('csv-parse@7.0.2: no audit vulnerability entry');
          NODE

      - name: Real csv-parse adapter tests
        run: node --test scripts/wave1/test-import-csv-parser-real.mjs

      - name: Wave1 combined T1 + T2 + T3
        run: npm run test:wave1

      - name: Import mutation suite
        run: node scripts/wave1/test-import-csv-mutation.mjs

      - name: Smart Setup mutation regression
        run: node scripts/wave1/test-smart-setup-mutation.mjs

      - name: Project tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Import CSV coverage
        run: node --test --experimental-test-coverage --test-coverage-include='lib/import-engine/**' scripts/wave1/test-import-csv.mjs scripts/wave1/test-import-csv-parse-policy.mjs scripts/wave1/test-import-csv-parser-real.mjs

      - name: Build environment check
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Build passed in GitHub Actions."
            exit 0
          fi
          if grep -q "Variaveis do Supabase nao configuradas no servidor." build.log && grep -q "/api/admin/bugs/\[id\]" build.log; then
            echo "Known CI environment limitation: protected Supabase server vars are not present in this QA harness."
            echo "Feature build evidence is supplied independently by the READY Vercel Preview for the exact feature SHA."
            exit 0
          fi
          exit "$code"
