name: Main Site v2 QA

on:
  pull_request:
    paths:
      - 'app/page.tsx'
      - 'app/sitemap.ts'
      - 'app/robots.ts'
      - 'app/solucoes/**'
      - 'components/marketing/**'
      - 'lib/marketing/**'
      - 'scripts/verify-main-site-v2.mjs'
      - 'docs/main-site-v2.md'
      - 'package.json'
      - '.github/workflows/main-site-v2.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Domain and regression invariants
        run: npm test
      - name: Payment boundary regression
        run: npm run verify:payments
      - name: Focused lint
        run: >-
          npx eslint
          app/page.tsx
          app/sitemap.ts
          app/robots.ts
          app/solucoes/[slug]/page.tsx
          components/marketing/MainSiteV2.tsx
          components/marketing/ProductDemoTabs.tsx
          components/marketing/PlanSelector.tsx
          components/marketing/ReferralBridge.tsx
          lib/marketing/main-site.ts
      - name: TypeScript and production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder
          NEXT_PUBLIC_APP_URL: https://ci.orcaly.invalid
        run: npm run build
      - name: Exact-SHA PR protected paths and whitespace guard
        if: github.event_name == 'pull_request'
        env:
          ORCALY_QA_SCOPE: main_site
          ORCALY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ORCALY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/verify-focused-pr-delta.cjs
      - name: Manual QA run has no PR-delta certification
        if: github.event_name == 'workflow_dispatch'
        run: echo "::notice::Manual QA checks are informational; no PR head/base was provided for protected diff certification."
      - name: Dependency audit baseline
        continue-on-error: true
        run: npm audit --audit-level=high

  global-lint-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Global lint baseline
        run: npm run lint
