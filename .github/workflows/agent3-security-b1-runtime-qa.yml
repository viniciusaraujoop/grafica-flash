name: Agent 3 Security B1 Runtime QA Harness

on:
  push:
    branches:
      - gpt/agent3-security-qa-harness
    paths:
      - .github/workflows/agent3-security-b1-runtime-qa.yml

permissions:
  contents: read

jobs:
  security-b1-runtime-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: qa-public-placeholder
      SUPABASE_SERVICE_ROLE_KEY: qa-server-placeholder
      PAYMENT_CREDENTIALS_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CRON_SECRET: qa-cron-placeholder
      NEXT_PUBLIC_ROOT_DOMAIN: example.test
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      ORCALY_APP_URL: http://127.0.0.1:3100
      WHATSAPP_APP_SECRET: agent3-b1-secret

    steps:
      - name: Checkout exact Security B1 SHA
        uses: actions/checkout@v4
        with:
          ref: bed2ee132d34f5c7f31093a224ca565729b7bf38

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Webhook HTTP sandbox
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3100 > /tmp/orcaly-security-b1-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          cat > agent3-webhook-b1-http.mjs <<'NODE'
          import assert from 'node:assert/strict'
          import crypto from 'node:crypto'
          import fs from 'node:fs'
          import { verifyWhatsAppSignature } from './lib/whatsapp.ts'

          const endpoint = 'http://127.0.0.1:3100/api/whatsapp/webhook'
          const secret = 'agent3-b1-secret'
          const sign = (body) => 'sha256=' + crypto.createHmac('sha256', secret).update(body).digest('hex')
          const body = JSON.stringify({ entry: [] })

          let response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-hub-signature-256': sign(body) },
            body,
          })
          assert.equal(response.status, 200)
          assert.deepEqual(await response.json(), { received: true })

          response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-hub-signature-256': 'sha256=00' },
            body,
          })
          assert.equal(response.status, 403)
          assert.deepEqual(await response.json(), { error: 'Assinatura inválida.' })

          const malformed = '{'
          response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-hub-signature-256': sign(malformed) },
            body: malformed,
          })
          assert.equal(response.status, 400)
          assert.deepEqual(await response.json(), { error: 'Payload inválido.' })

          const oversized = 'x'.repeat(1_000_001)
          response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-hub-signature-256': 'sha256=00' },
            body: oversized,
          })
          assert.equal(response.status, 413)
          assert.deepEqual(await response.json(), { error: 'Payload excede o limite permitido.' })

          delete process.env.WHATSAPP_APP_SECRET
          assert.equal(verifyWhatsAppSignature(body, sign(body)), false)

          const route = fs.readFileSync('app/api/whatsapp/webhook/route.ts', 'utf8')
          assert.match(route, /Falha ao processar webhook WhatsApp\./)
          assert.doesNotMatch(route, /error instanceof Error \? error\.message/)
          console.log('Webhook B1 HTTP sandbox: PASS')
          NODE
          node agent3-webhook-b1-http.mjs

      - name: Google revoke mock sandbox
        shell: bash
        run: |
          set -euo pipefail
          cat > agent3-google-revoke-b1.mts <<'TS'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          import { bootstrapIntegrationAdapters } from './lib/integrations/adapters.ts'
          import { getIntegrationAdapter } from './lib/integrations/core/registry.ts'

          function query(events: string[], table: string) {
            const q: any = {}
            for (const method of ['select','eq','update','delete','in']) q[method] = (..._args: any[]) => q
            q.then = (resolve: (value: unknown) => void) => {
              if (table === 'integration_push_channels') events.push('stop_watches')
              if (table === 'background_jobs') events.push('cancel_watch_jobs')
              resolve({ data: [], error: null })
            }
            return q
          }

          bootstrapIntegrationAdapters()
          const adapter = getIntegrationAdapter('google_calendar')
          assert.ok(adapter?.disconnect)

          {
            const events: string[] = []
            globalThis.fetch = (async () => {
              events.push('provider_revoke')
              return new Response('', { status: 200 })
            }) as typeof fetch
            const context: any = {
              db: { from: (table: string) => query(events, table) },
              connection: { id: '11111111-1111-4111-8111-111111111111', companyId: '22222222-2222-4222-8222-222222222222' },
              loadCredentials: async () => { events.push('credential_available'); return { refresh_token: 'sandbox-refresh-token' } },
              emitAudit: async (action: string) => { events.push(action) },
              setConnectionStatus: async () => {},
            }
            await adapter!.disconnect!(context)
            assert.ok(events.indexOf('stop_watches') >= 0)
            assert.ok(events.indexOf('credential_available') > events.indexOf('stop_watches'))
            assert.ok(events.indexOf('provider_revoke') > events.indexOf('credential_available'))
            assert.ok(events.includes('integration.provider_revoke_succeeded'))
          }

          {
            const events: string[] = []
            globalThis.fetch = (async () => { events.push('provider_revoke'); throw new Error('sandbox network unavailable') }) as typeof fetch
            const context: any = {
              db: { from: (table: string) => query(events, table) },
              connection: { id: '11111111-1111-4111-8111-111111111111', companyId: '22222222-2222-4222-8222-222222222222' },
              loadCredentials: async () => { events.push('credential_available'); return { refresh_token: 'sandbox-refresh-token' } },
              emitAudit: async (action: string) => { events.push(action) },
              setConnectionStatus: async (status: string, reason: string) => { events.push(status + ':' + reason) },
            }
            await assert.rejects(() => adapter!.disconnect!(context))
            assert.ok(events.includes('ERROR:google_revoke_failed'))
            assert.ok(events.includes('integration.provider_revoke_failed'))
          }

          const route = fs.readFileSync('app/api/integrations/[provider]/route.ts', 'utf8')
          const disconnect = route.indexOf('await adapter.disconnect')
          const deleteLocal = route.indexOf('await deleteIntegrationCredentials')
          assert.ok(disconnect >= 0 && deleteLocal > disconnect)
          assert.match(route, /credential_preserved: true/)
          console.log('Google revoke B1 mock sandbox: PASS')
          TS
          npx --yes tsx@4.20.6 agent3-google-revoke-b1.mts
