name: Platform Evolution 3

on:
  push:
    branches:
      - feat/platform-evolution-3
  pull_request:
    branches:
      - feat/main-site-v2

permissions:
  contents: read

concurrency:
  group: platform-evolution-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Platform and regression tests
        run: npm test

      - name: Payment boundary regression
        run: npm run verify:payments

      - name: Security static checks
        run: npm run security:check

      - name: Production build
        run: npm run build

      - name: Diff whitespace validation
        run: git diff --check

      - name: Dependency audit baseline
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
