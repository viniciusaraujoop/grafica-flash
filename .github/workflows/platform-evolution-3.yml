name: Orçaly Platform Quality Gate

on:
  push:
    branches:
      - feat/platform-evolution-3
      - feat/orcaly-3-1
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: orcaly-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Platform and regression tests
        run: npm test

      - name: Payment boundary regression
        run: npm run verify:payments

      - name: Security static checks
        run: npm run security:check

      - name: Dependency security gate
        run: npm run security:dependencies

      - name: TypeScript recovery check
        run: npx tsc --noEmit --pretty false

      - name: Production build
        env:
          # Publishable-only compile fixture. Runtime privileged access is never exercised in this step.
          NEXT_PUBLIC_SUPABASE_URL: https://ozrasuktfthsvbqprtel.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_mfiQJ5W1Y1VInPHNHBaOAA_Lauq-Cfh
          SUPABASE_SERVICE_ROLE_KEY: sb_publishable_mfiQJ5W1Y1VInPHNHBaOAA_Lauq-Cfh
        run: npm run build

      - name: Diff whitespace validation
        run: git diff --check
