name: Orçaly 3.1 AI Smoke

on:
  push:
    branches:
      - feat/orcaly-3-1
      - main
    paths:
      - app/api/public/home-chat/route.ts
      - app/api/internal/preview-build/route.ts
      - scripts/orcaly-3-1-ai-smoke.mjs
      - .github/workflows/orcaly-3-1-ai-smoke.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: orcaly-3-1-ai-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-ai-eval:
    if: github.ref == 'refs/heads/feat/orcaly-3-1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate smoke script syntax
        run: node --check scripts/orcaly-3-1-ai-smoke.mjs
      - name: Mint trusted GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken()
            core.setSecret(token)
            core.setOutput('token', token)
      - name: Wait for exact Preview commit
        env:
          ORCALY_BASE_URL: https://orcaly-git-feat-orcaly-3-1-vinicius-araujos-projects.vercel.app
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          observed=''
          for attempt in $(seq 1 48); do
            body=$(curl -fsS \
              -H "x-vercel-trusted-oidc-idp-token: ${VERCEL_TRUSTED_OIDC_TOKEN}" \
              "${ORCALY_BASE_URL}/api/internal/preview-build" 2>/dev/null || true)
            observed=$(BODY="$body" node -e "try{process.stdout.write(JSON.parse(process.env.BODY||'{}').commit||'')}catch{}")
            if [ "$observed" = "$EXPECTED_SHA" ]; then
              echo "Preview converged to ${EXPECTED_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo "Preview did not converge. expected=${EXPECTED_SHA} observed=${observed:-none}" >&2
          exit 1
      - name: Run complete Preview AI eval
        env:
          ORCALY_BASE_URL: https://orcaly-git-feat-orcaly-3-1-vinicius-araujos-projects.vercel.app
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: node scripts/orcaly-3-1-ai-smoke.mjs --full

  production-ai-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate smoke script syntax
        run: node --check scripts/orcaly-3-1-ai-smoke.mjs
      - name: Probe production AI provider
        env:
          ORCALY_BASE_URL: https://orcaly.com.br
        run: node scripts/orcaly-3-1-ai-smoke.mjs --full
